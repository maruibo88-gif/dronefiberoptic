<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOSOLLY | Fiber Optic Spools & Winding Equipment</title>
  <meta name="description" content="LOSOLLY fiber optic spools and precision winding equipment.">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .loading {
      font-size: 18px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="loading">
    Loading LOSOLLY...
  </div>

  <script>
    /*
      LOSOLLY automatic language detection

      Priority:
      1. Country/IP
      2. Browser language
      3. English fallback
    */

    async function detectLanguage() {

      let country = "";
      let browserLanguage = (
        navigator.language ||
        navigator.userLanguage ||
        "en"
      ).toLowerCase();

      /*
        Cloudflare provides the visitor country through
        /cdn-cgi/trace when the website is served through Cloudflare.
      */
      try {
        const response = await fetch("/cdn-cgi/trace", {
          cache: "no-store"
        });

        const text = await response.text();

        const match = text.match(/(?:^|\n)loc=([A-Z]{2})(?:\n|$)/);

        if (match) {
          country = match[1].toUpperCase();
        }
      } catch (error) {
        console.log("Country detection unavailable.");
      }


      /*
        ==========================================
        1. Country-based language
        ==========================================
      */

      // Russia
      if (country === "RU") {
        return "/ru/";
      }

      // China
      if (country === "CN") {
        return "/zh/";
      }

      /*
        Arabic-speaking countries
      */
      const arabicCountries = [
        "SA", // Saudi Arabia
        "AE", // UAE
        "QA", // Qatar
        "KW", // Kuwait
        "BH", // Bahrain
        "OM", // Oman
        "JO", // Jordan
        "LB", // Lebanon
        "IQ", // Iraq
        "EG", // Egypt
        "DZ", // Algeria
        "MA", // Morocco
        "TN", // Tunisia
        "LY", // Libya
        "YE", // Yemen
        "SY", // Syria
        "PS", // Palestine
        "SD", // Sudan
        "MR", // Mauritania
        "SO", // Somalia
        "DJ", // Djibouti
        "KM", // Comoros
      ];

      if (arabicCountries.includes(country)) {
        return "/ar/";
      }


      /*
        ==========================================
        2. Central Asia
        ==========================================
      */

      const centralAsiaCountries = [
        "KZ", // Kazakhstan
        "UZ", // Uzbekistan
        "KG", // Kyrgyzstan
        "TJ", // Tajikistan
        "TM"  // Turkmenistan
      ];

      if (centralAsiaCountries.includes(country)) {

        // Russian browser -> Russian
        if (browserLanguage.startsWith("ru")) {
          return "/ru/";
        }

        // Otherwise English
        return "/en/";
      }


      /*
        ==========================================
        3. Browser language
        ==========================================
      */

      if (browserLanguage.startsWith("ru")) {
        return "/ru/";
      }

      if (browserLanguage.startsWith("ar")) {
        return "/ar/";
      }

      if (browserLanguage.startsWith("zh")) {
        return "/zh/";
      }

      if (browserLanguage.startsWith("en")) {
        return "/en/";
      }


      /*
        ==========================================
        4. Default
        ==========================================
      */

      return "/en/";
    }


    /*
      Start detection
    */
    detectLanguage().then(function(language) {
      window.location.replace(language);
    });
  </script>

</body>
</html>
